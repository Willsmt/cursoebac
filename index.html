<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>Formulario</title>
  </head>
  <body>
    <div class="container">
      <h2>formulário de cadastro</h2>
      <form>
        <label class="form-label" for="nome">Digite seu nome</label>
        <input class="form-control" type="text" id="nome" />
        <label class="form-label" for="e-mail">Digite seu e-mail</label>
        <input class="form-control" type="text" id="e-mail" />
        <label class="form-label" for="tel">Digite seu Telefone</label>
        <input class="form-control" type="tel" id="tel" />
        <button class="btn btn-success mt-2">Enviar</button>
      </form>
    </div>
  </body>
</html>
